# gen2: Wi-Fi power save OFF for every connection.
# Power save waits for beacon intervals (~100 ms) and caused 50-300 ms latency tails on robot
# telemetry / camera (desktop measurements 2026-09-26, 2026-10-05). 2 = disable.
#
# The file name MUST sort after "default-wifi-powersave-on.conf" (shipped by the network-manager
# package, wifi.powersave = 3). NetworkManager reads conf.d in alphabetical order and the last
# file wins. This used to be "99-gen2-..." — digits sort before letters, so the package default
# was read last and power save came back on after every reboot (2026-10-05). Hence "zz-".
# Check with:  NetworkManager --print-config | grep -A1 powersave   ->  wifi.powersave=2
[connection]
wifi.powersave = 2
