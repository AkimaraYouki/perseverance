# gen2: serve time to the desktop PC on the same LAN / phone hotspot (camera latency measurement).
# The Jetson itself still syncs to the internet pools (chrony.conf) when online.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
# keep serving (stratum 10) even when the hotspot has no internet
local stratum 10
