# gen2: answer ARP only for addresses configured on the receiving interface.
# Without this the Jetson answered "192.168.55.1 is-at <eth MAC>" on the campus LAN because
# 192.168.55.1 lives on l4tbr0 (USB device mode) — hijacking that address on the wired network.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
