# Ignore routes whose interface has no carrier (gen2, 2026-10-03).
# The USB device-mode default route (l4tbr0, metric 100) wins over Wi-Fi while the desktop is plugged in;
# when the cable is pulled, l4tbr0 loses carrier and this makes the kernel fall back to the Wi-Fi default route.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
