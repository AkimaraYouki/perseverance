# Game pad on the Jetson (or desktop): joy_node (SDL game-controller layout) + gen2_tools/pad_teleop.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0      # keep /joy flowing while the sticks are held (pad_teleop needs < 0.5 s gaps)
pad_teleop:
  ros__parameters:
    vx_max: 0.97               # stick end [m/s] = 3.5 km/h (user 2026-10-09: 0.5 too slow)
    wz_max: 2.0                # [rad/s]
    height_rate: 0.05          # [m/s] while a trigger is fully pressed
    deadzone: 0.08
    joy_timeout_s: 0.5
    # the user's pad (Xbox over Bluetooth, measured 2026-10-09 with `ros2 topic echo /joy`)
    vx_axis: 1
    wz_axis: 2
    lt_axis: 5
    rt_axis: 4
    a_button: 0
    b_button: 1
    y_button: 4
    lb_button: 6
    rb_button: 7
    back_button: 10
    start_button: 11
