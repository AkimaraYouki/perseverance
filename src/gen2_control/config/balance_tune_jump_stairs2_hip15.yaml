# Desktop jump bundle, latest as of 2026-10-23 (NOT loaded by default — pass as an extra --params-file after
# balance.yaml, or copy into balance.yaml, after the user's OK).
# Base: sim/model/robot_params_2026-10-14_kt083/balance_tune_jump_cma11_hip15.yaml (CMA-11, hip command cap 15 N·m).
# Overlay: comms/to-robot/2026-10-20_desktop-step-detect-mode.md "갱신 2 (2026-10-21)" — the 2-tier competition-stairs
# optimum (extract_pitch, h_land, land_kp, land_kd, spin_match_k). Not portable yet (wb_core has no jump_retry):
# trigger 0.27, retry_trig_k 0.4, retry_v 0.3, retry_approach_v 0.14, retry_back_m 0.3004, retry_block_s 0.15,
# retry_settle_s 0.5, retry_stall_frac 0.5 (step-detect mode).
# Sim (calibrated plant, 15 N·m, 2048 runs, with auto retries): stairs 6 cm 97.3 %, 8 cm 98.5 %, step 10 cm 99.8 %,
# 12 cm 98.3 %. Manual Y jump (no retries): 8 cm 60 %, 10 cm 53 %. Expect hip current ~8-9 A while extending
# (current_limit_a 15) — watch sat_frac faults, hip temperature and the landing current peak (land_hip_cur).
balance:
  ros__parameters:
    hip_pd_tau_max: 15.0      # [12.0] hip command cap for this bundle
    tune:
      t_retract: 0.16
      retract_lean: 8.6
      extract_pitch: 6.7183   # 갱신 2 [hip15 9.7]
      t_tuck: 0.151
      air_kp: 10.1
      air_kd: 0.55
      air_pitch: -7.5
      land_pitch: 2.1
      land_kp: 22.8847        # 갱신 2 [hip15 35.1]
      land_kd: 0.5            # 갱신 2 [hip15 1.47]
      land_s: 0.557
      h_land: 0.2051          # 갱신 2 [hip15 0.1978]
      contact_tau: 0.3
      leg_kp: 83.0
      leg_kd: 0.56
      spin_match_k: 0.6944    # 갱신 2 [hip15 0.382]
      air_w_max: 12.0
