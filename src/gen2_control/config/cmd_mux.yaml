cmd_mux:
  ros__parameters:
    lidar_limit: false         # 2026-10-09 user: off — robot's own right leg/wheel hits (0.08-0.33 m at -22..-67 deg) blocked driving; on again after the self-mask
    teleop_timeout_s: 0.5
    auto_timeout_s: 0.5
    stop_dist_m: 0.30          # LiDAR return this close in the travel corridor -> vx 0
    slow_dist_m: 0.50          # full speed beyond this (0.80 felt like sudden braking while driving, 2026-10-09)
    corridor_half_width_m: 0.20  # wheel track 0.198 m + margin
    self_radius_m: 0.20        # ignore the robot's own legs/wheels (VERIFY on the robot)
    lidar_forward_deg: 0.0     # scan angle of the robot front. 2026-10-08 hand moved in front: most changing -12..+4 deg -> 0 OK
    scan_timeout_s: 0.5
    stale_vx_max: 0.1
