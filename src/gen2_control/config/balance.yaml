# balance_node (gen2_control). Loaded together with gen2_hardware/config/motors.yaml and leg_table.yaml.
# Model tables (LQR K(l), masses, leg COM / wheel kinematics) come from the desktop:
# sim/model/balance_tables.yaml (requested 2026-10-07). Without them only 'stand' is allowed.
balance:
  ros__parameters:
    rate_hz: 200.0
    rt_priority: 80
    max_tilt_deg: 45.0        # fault beyond this (fell)
    start_tilt_deg: 15.0      # stand/balance only when the body is held within this
    imu_timeout_s: 0.05
    motor_timeout_s: 0.05
    heartbeat_timeout_s: 1.0  # operator tool must publish balance/heartbeat (0.5 -> 1.0 2026-10-09: 32 Wi-Fi gaps/h of 0.55-1.4 s jerked the robot to a stop)
    cmd_timeout_s: 0.5        # cmd_vel watchdog -> 0
    stand_ramp_s: 2.0         # stand: current leg height -> idle_h
    th_trim_deg: -1.2         # balance-point trim, + = lean back. 0 = CAD COM (th_kin). 2026-10-08 after the IMU was re-seated (user):
                              # 0 -> bias adapt +1.1, max 0.61 m; -1.0 -> bias -0.45, max 0.09 m; user picked -1.2
    stand_feedforward: true   # stand: + weight feed-forward (0.5 m g per leg, via dh/dtheta) — current_pd only
    hip_mode: mit_pos         # 2026-10-09: mit_pos = p, kp, kd in the drive (kHz), ff from here. mit = host kp at 200 Hz (legs lagged 150 deg at 2.8 Hz -> roll rocking). servo_pos | current_pd old
    mit_kt_drive: 0.5994      # Kt the AK60-6 drive uses inside MIT (0.5 N·m -> 0.83 A measured 2026-10-07)
    hip_pd_tau_max: 9.0       # mit_pos: clip the position error so the drive PD (+ |ff|) stays <= 9 N·m (sim hip limit).
                              # 2026-10-12 first real jumps: the extension step gave 28-32 A (desktop comms 2235 / 0335)
    osc_flips: 6              # fault: hip velocity (|w| > osc_vel) changes sign this often within osc_window_s
    osc_window_s: 0.3
    osc_vel_rad_s: 1.0
    sat_frac: 0.9             # fault: hip current > sat_frac x current_limit for sat_time_s
    sat_time_s: 0.1
    sit_sat_current_a: 5.0    # while sitting: hip |I| above this for sat_time_s = leg blocked -> fault (2026-10-08 leg_r link slipped at 9.9 A)
    hip_speed_rad_s: 2.0      # servo_pos speed limit
    hip_accel_rad_s2: 20.0
    tune:                     # wbctrl TUNE (climb_test defaults); others in gen2_control/wb_core.hpp Params
      idle_h: 0.1825
      vmc_kp: 60.0
      vmc_kd: 1.0
      vmax_kmh: 3.5
      accel_max: 0.8          # m/s^2 (1.5 -> 0.8 2026-10-09: full stick overshot to 1.28 m/s, pitch +-27 deg)
      lean_ff: 1.0            # desktop 2026-10-09: lean ahead by atan(a_ref/g) -> sim flat_stop 5 -> 15/16 (0.70 -> 0.40 m past the release)
      x_leak_moving: 0.5      # 1/s, driving: x_err leaks (steady speed error fixed, big catch-up forgotten in 2 s)
      jerk_max: 3.0           # m/s^3 S-curve speed reference: the lean builds up smoothly (0 = old ramp)
      x_hold_moving: false    # position hold only when the stick is released (it added catch-up overshoot while driving)
      fric_comp_nm: 0.0       # 2026-10-08 MIT wheels: 0.11 (velocity-sign Coulomb comp) drove a 12-15 Hz wheel chatter; 0 = quiet
      yaw_kd: 0.15            # 2026-10-08 MIT wheels: 0.5 (sim) gave a 13 Hz L/R torque chatter; 0.15 quiet
      yaw_ki: 1.0             # desktop 2026-10-08 (sim): kd 0.15 alone stalls on stiction (0.02 rad/s of 0.5); + ki 1.0 -> 0.44-0.48, pivot 4-6 cm
      yaw_i_max: 0.5
      db_comp: 2              # 0 off, 1 boost, 2 sigma
      db_comp_nm: 0.65
      wheel_lpf_hz: 20.0
      bal_adapt: 0.3          # user 2026-10-08 (0.1 / 0 tried: 0 stops the bias walk but parks ~0.17 m off)
      contact_tau_min: 0.8
      roll_kp: 1.0            # 2026-10-12 retest with hip_mode mit_pos (legs -29 deg at 2.8 Hz instead of -150): step 2 of the desktop plan
      roll_ki: 8.0            # 10-09 with mit (host kp) this rocked at 2.8 Hz; 10-12 with mit_pos: quiet (roll sd 0.35 deg, no 2.8 Hz), pushes/ramp OK. fallback 0.5 / 3
      roll_kd: 0.1            # 2026-10-12 desktop step 3 (sim 80/80); user: "너무 잘됨". push recovery 0.13-0.26 s; hip current 10-100 Hz 0.24 A (0.05 with kd 0)
      roll_rate_lpf_hz: 4.0   # roll-rate LPF for the kd term (wb_core default 8)
      turn_lean: 0.0          # needs the roll loop
      jump_max_v: 0.0         # JUMP OFF (any request refused: v > 0): 2026-10-13 the CMA-1 set below landed with legs tucked and
                              # wheels spinning backwards -> broke a wheel; desktop 1800: no jumps until CMA-3. Was 0.4 (0.2-0.4 m/s).
      # jump state machine (only used outside DRIVE): desktop sim CMA-ES 2026-10-13 (comms 1500; real plant: delays, backlash,
      # hip 9 N.m, DR). Approach 0.2-0.4 m/s, 2048 runs each: flat 66 -> 86 % success, 6 cm 26 -> 63 %, 8 cm 24 -> 56 %.
      # Use as one set. Previous value in [] (wb_core defaults; retract_lean was 0 from 10-13 morning).
      t_retract: 0.256        # [0.25]
      retract_lean: 5.0       # [0.0] the set's stronger air PD takes the lean
      extract_pitch: -1.6     # [0.0]
      t_tuck: 0.235           # [0.12]
      air_kp: 46.2            # [30.0]
      air_kd: 3.64            # [5.0]
      air_pitch: -6.7         # [-5.0]
      land_pitch: -1.0        # [0.0]
      land_kp: 11.4           # [20.0]
      land_kd: 2.10           # [1.0]
      land_s: 0.166           # [0.30]
      h_land: 0.183           # [0.1825]
      contact_tau: 1.79       # [2.0]
      leg_kp: 90.0            # [60.0] (search bound; hip_pd_tau_max 9 N.m still caps it)
      leg_kd: 1.125           # [1.5]
