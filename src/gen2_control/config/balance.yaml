# balance_node (gen2_control). Loaded together with gen2_hardware/config/motors.yaml and leg_table.yaml.
# Model tables (LQR K(l), masses, leg COM / wheel kinematics) come from the desktop:
# sim/model/balance_tables.yaml (requested 2026-10-07). Without them only 'stand' is allowed.
balance:
  ros__parameters:
    rate_hz: 200.0
    rt_priority: 80
    max_tilt_deg: 45.0        # fault beyond this (fell)
    start_tilt_deg: 15.0      # stand/balance only when the body is held within this
    imu_timeout_s: 0.05
    motor_timeout_s: 0.05
    heartbeat_timeout_s: 0.5  # operator tool must publish balance/heartbeat
    cmd_timeout_s: 0.5        # cmd_vel watchdog -> 0
    stand_ramp_s: 2.0         # stand: current leg height -> idle_h
    stand_feedforward: true   # stand: + weight feed-forward (0.5 m g per leg, via dh/dtheta) — current_pd only
    hip_mode: servo_pos       # servo_pos (drive position loop) | current_pd (host PD, shook at 200 Hz 2026-10-07)
    hip_speed_rad_s: 2.0      # servo_pos speed limit
    hip_accel_rad_s2: 20.0
    tune:                     # wbctrl TUNE (climb_test defaults); others in gen2_control/wb_core.hpp Params
      idle_h: 0.1825
      vmc_kp: 60.0
      vmc_kd: 1.0
      vmax_kmh: 3.5
      fric_comp_nm: 0.11
      db_comp: 2              # 0 off, 1 boost, 2 sigma
      db_comp_nm: 0.65
      wheel_lpf_hz: 20.0
      bal_adapt: 0.3
      contact_tau_min: 0.8
