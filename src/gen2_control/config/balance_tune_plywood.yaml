# "합판" 점프 세트 (2026-10-28 대회 1 일차 밤, 데스크톱): 미끄러운 합판 턱용. balance.yaml 위에 얹는 13 키 (기본 미적용).
# 켜기: gen2_tune.sh plywood (해제 상태), 끄기: gen2_tune.sh default. GCS GUI '점프 세트 (턱 재질)' 에서 고름.
# 사용자: "합판이라 미끄러움, 6 cm 1 단만 성공, 2 단째 앞으로 고꾸라짐, 수직으로 딱 서게 튜닝" -> 턱 마찰 0.7 (바퀴 0.5–0.8 x 0.7) 에서
# 2 단 6/8 cm 섞어 CMA 20 세대 (점수 = 성공 − 2 넘어짐 − 1.0 x 착지 pitch 벌점 − 착지 뒤 후진 벌점).
# 시뮬 (실기 보정 플랜트, 2 단 칸 1 m, 턱 감지 모드, 2048 판, 기본 -> 합판):
#   마찰 0.7: 6 cm 33.3 -> 51.6 %, 8 cm 35.2 -> 58.4 %   마찰 0.5: 0.3 -> 11.6 %, 0.5 -> 17.3 %
#   마찰 1.0 (잘 붙는 판): 76.5 -> 62.2 %, 73.5 -> 58.4 % (끝까지 못 감 21–23 %)  => 잘 붙는 판에서는 기본 세트
#   착지 pitch −15 -> −9°, 착지 뒤 후진 −0.4 -> 0.0 m/s.  주의: 착지 바퀴 하중 ~410 -> ~580 N (허브 확인)
# 이 13 키만 바뀜. [] = 기본 (balance.yaml).
balance:
  ros__parameters:
    tune:
      retract_lean: 8.3918      # [8.6]
      extract_pitch: 12.0       # [6.7183]
      t_tuck: 0.1564            # [0.151]
      air_kp: 12.3411           # [10.1]
      air_kd: 0.9222            # [0.55]
      air_pitch: -3.9827        # [-7.5]
      land_pitch: -1.2711       # [2.1]
      land_kp: 41.1829          # [22.8847]
      land_kd: 0.6298           # [0.5]
      h_land: 0.2289            # [0.2051]
      spin_match_k: 0.2808      # [0.6944]
      air_w_max: 14.463         # [12.0]
      retry_trig_k: 0.2593      # [0.4]
