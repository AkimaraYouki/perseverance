# "합판" 점프 세트 v4 (2026-10-29 대회 2 일차 새벽, 데스크톱): 미끄러운 합판 8 cm 턱용. balance.yaml 위에 얹는 19 키 (기본 미적용).
# 켜기: gen2_tune.sh plywood (해제 상태), 끄기: gen2_tune.sh default. GCS GUI '점프 세트 (턱 재질)' 에서 고름.
# 사용자: "합판이라 미끄러움, 2 단째 앞으로 고꾸라짐, 수직으로 딱 서게", "90퍼까지", "2 일차는 8 cm 만", "더 최적화 가능?"
# -> v1 (13 키) -> v3 (+ 턱 감지 후진·재진입·발사 4 키) -> v4 (+ land_s, leg_kp, 후진 속도 상한 넓힘). 2 단 8 cm / 턱 마찰 0.7 CMA.
# 시뮬 2 단 8 cm (실기 보정 플랜트, 칸 1 m, 턱 감지 모드, 2048 판) 성공률, 기본 -> v1 -> v3 -> v4:
#   마찰 0.5: 0.5 -> 17.3 -> 23.2 -> 31.5 %   마찰 0.7: 35.2 -> 58.4 -> 67.3 -> 72.0 %   마찰 1.0: 73.5 -> 58.4 -> 86.9 -> 89.2 %
#   => 잘 붙는 판에서도 기본보다 나음. 남은 실패는 대부분 착지 뒤 앞으로 (미끄럼) -> 바퀴 고무·판 먼지 닦기가 큼.
#   착지 pitch −15 (기본) -> −7°. 착지 바퀴 하중 ~440 N (v3 ~550, 기본 ~410). 6 cm 는 안 잼.
# 이 19 키만 바뀜. [] = 기본 (balance.yaml).
balance:
  ros__parameters:
    tune:
      retract_lean: 7.8512      # [8.6]
      extract_pitch: 11.6983    # [6.7183]
      t_tuck: 0.1407            # [0.151]
      air_kp: 12.6464           # [10.1]
      air_kd: 0.8272            # [0.55]
      air_pitch: -1.8576        # [-7.5]
      land_pitch: -4.9586       # [2.1]
      land_kp: 30.6369          # [22.8847]
      land_kd: 0.8743           # [0.5]
      h_land: 0.2266            # [0.2051]
      spin_match_k: 0.2627      # [0.6944]
      air_w_max: 14.2228        # [12.0]
      retry_trig_k: 0.1536      # [0.4]
      retry_back_v: 0.3387      # [0.3]
      retry_back_m: 0.3478      # [0.3004]
      retry_v: 0.3019           # [0.3]
      trigger: 0.2189           # [0.27]
      land_s: 0.6295            # [0.557]
      leg_kp: 72.9382           # [83.0]
