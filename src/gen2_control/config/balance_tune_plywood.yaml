# "합판" 점프 세트 v3 (2026-10-29 대회 2 일차 새벽, 데스크톱): 미끄러운 합판 8 cm 턱용. balance.yaml 위에 얹는 17 키 (기본 미적용).
# 켜기: gen2_tune.sh plywood (해제 상태), 끄기: gen2_tune.sh default. GCS GUI '점프 세트 (턱 재질)' 에서 고름.
# 사용자: "합판이라 미끄러움, 2 단째 앞으로 고꾸라짐, 수직으로 딱 서게", "90퍼까지", "2 일차는 8 cm 만"
# -> v1 (13 키, 6/8 cm 섞음) 에서 출발, 턱 감지 후진·재진입·발사 4 키 추가, 2 단 8 cm 만 / 턱 마찰 0.7 에서 CMA 18 세대 (좁은 탐색).
# 시뮬 2 단 8 cm (실기 보정 플랜트, 칸 1 m, 턱 감지 모드, 2048 판) 성공률, 기본 -> v1 -> v3:
#   마찰 0.5: 0.5 -> 17.3 -> 23.2 %   마찰 0.7: 35.2 -> 58.4 -> 67.3 %   마찰 1.0: 73.5 -> 58.4 -> 86.9 %
#   => v3 는 잘 붙는 판에서도 기본보다 나음. 90 % 는 못 감: 남은 실패는 대부분 착지 뒤 앞으로 (미끄럼) -> 바퀴 고무·판 먼지 닦기가 큼.
#   착지 pitch −15 (기본) -> −8°. 주의: 착지 바퀴 하중 ~410 -> ~550 N (허브 확인). 6 cm 는 이번에 안 잼.
# 이 17 키만 바뀜. [] = 기본 (balance.yaml).
balance:
  ros__parameters:
    tune:
      retract_lean: 8.0591      # [8.6]
      extract_pitch: 12.274     # [6.7183]
      t_tuck: 0.1565            # [0.151]
      air_kp: 14.5503           # [10.1]
      air_kd: 0.6946            # [0.55]
      air_pitch: -1.1774        # [-7.5]
      land_pitch: -4.4691       # [2.1]
      land_kp: 35.1897          # [22.8847]
      land_kd: 0.7112           # [0.5]
      h_land: 0.2203            # [0.2051]
      spin_match_k: 0.2231      # [0.6944]
      air_w_max: 13.7212        # [12.0]
      retry_trig_k: 0.1234      # [0.4]
      retry_back_v: 0.32        # [0.3]
      retry_back_m: 0.3332      # [0.3004]
      retry_v: 0.3079           # [0.3]
      trigger: 0.2362           # [0.27]
