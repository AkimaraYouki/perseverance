# vmc_lqr_design.py 생성. 손으로 고치지 말고 스크립트를 다시 돌릴 것.
# urdf: robot_simple.urdf, extra_mass_kg: 0.25
# 상태 [theta, theta_dot, x - x_d, x_dot - v_d], u = -K x = T_theta (두 바퀴 합, Nm)
# 분배: T_L = 0.5 T_theta + 0.5 T_delta, T_R = 0.5 T_theta - 0.5 T_delta
lqr:
  Q_diag: [6000.0, 1.0, 1000.0, 100.0]
  R: 100.0
  h_range_m: [0.1825, 0.3025]
  poly_p0_p1_p2:
    theta: [-8.59877310e+00, -2.02299948e+01, 1.21440813e+01]
    theta_dot: [-3.68180386e-01, -3.85453228e+00, -2.28060059e+00]
    x: [-3.16227766e+00, -5.02239487e-12, 5.60710352e-12]
    x_dot: [-4.04058320e+00, 5.05159078e+00, -8.75613264e+00]
vmc:
  supported_mass_kg: 4.1469   # 바퀴 위 전체. F_d = M g / cos(theta), 다리당 절반
  jacobian: leg_map.dh_dtheta   # tau_hip = F_leg * dh_dtheta(theta_motor)
